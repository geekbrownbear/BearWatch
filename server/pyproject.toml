[project]
name = "bearwatch"
version = "0.1.0"
description = "Endpoint and exposure vulnerability platform for MSPs (server and intel sync)"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
bearwatch = "bearwatch.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bearwatch*"]

# Migrations, templates and static files are not Python packages; ship them as data.
[tool.setuptools.package-data]
bearwatch = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
