# When each Windows version stops getting security updates. Used by the monthly report and the
# device page to flag PCs on a version Microsoft no longer patches.
#
# Sources (checked 2026-11-05):
#   https://learn.microsoft.com/windows/release-health/supported-versions-windows-client
#   https://learn.microsoft.com/windows/release-health/windows11-release-information
#   https://learn.microsoft.com/lifecycle/products/windows-10-home-and-pro
#   https://learn.microsoft.com/lifecycle/announcements/windows-server-2012-r2-end-of-support
#   https://learn.microsoft.com/lifecycle/products/ (Windows Server 2016, 2019, 2022, 2025)
#
# `build` is the third part of the OS build (10.0.<build>.<revision>). Client versions list two
# dates: Home and Pro editions, and Enterprise and Education editions (36 months instead of 24).
# Servers list the end of extended support. Paid Extended Security Updates (ESU) are not counted:
# a PC on ESU still shows as out of support, and the technician can add an exception.
#
# Add each new Windows version when it ships; a build missing from this file is "unknown", never
# "supported".

[[client]]
build = 10240
name = "Windows 10, version 1507"
home_pro = 2017-05-09
enterprise = 2017-05-09

